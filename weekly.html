<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TwentySeed Weekly Packets</title><style>
body{font:16px system-ui;background:#f5f8f3;color:#183a2b;margin:0}main{max-width:950px;margin:auto;padding:22px}header{display:flex;align-items:center;gap:20px}header img{width:190px}section{background:white;padding:18px;margin:18px 0;border:1px solid #dce5d9;border-radius:12px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:9px;max-width:100%}button{background:#205d38;color:white;border:0;border-radius:6px;margin:6px;cursor:pointer}.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}.kinds label{margin:5px}.page{background:white;margin:16px auto;padding:20px;break-after:page;border:1px solid #ddd;min-height:8in}.page h2{margin:6px 0}.questions{white-space:pre-wrap;display:grid;grid-template-columns:1fr 1fr;gap:18px}.questions.wide{display:block;font-family:monospace}.question{break-inside:avoid;white-space:pre-wrap}.answer-page{break-before:page}.answer-page .questions{display:block}.brand{width:150px}#status{color:#7b3118}@media print{@page{size:letter;margin:.55in}body{background:white}header,.controls,#status{display:none!important}main{padding:0;max-width:none}#output{display:block}.page{border:0;margin:0;padding:0;min-height:0;break-after:page}.question{break-inside:avoid}.questions{gap:14px}.page:last-child{break-after:auto}}
</style><main><header><img src="logo.svg" alt="TwentySeed Learning"><h1>Weekly learning packets</h1></header><div class="controls"><section><h2>Student profiles</h2><label>Student name <input id="name" maxlength="60"></label><label>Questions per worksheet <select id="count"><option>6</option><option selected>12</option><option>18</option><option>24</option></select></label><label>Difficulty <select id="difficulty"><option value="10">Beginner</option><option value="12" selected>Intermediate</option><option value="50">Advanced</option></select></label><label>Arithmetic operation <select id="op"><option>+</option><option>−</option><option>×</option><option>÷</option></select></label><label>Custom words (comma-separated) <input id="words" value="apple,garden,river,school"></label><p>Choose worksheet categories:</p><div id="kinds" class="kinds"></div><button id="add">Save student locally</button><div id="profiles"></div><p><small>Profiles are stored in this browser only. Avoid shared devices for personal student details.</small></p></section><section><h2>Build packet</h2><label>Days <select id="days"><option>1</option><option>3</option><option selected>5</option><option>7</option></select></label><label><input type="checkbox" id="keys" checked> Include answer keys</label><button id="build">Generate weekly packet</button><button id="print">Print / Save as PDF</button><p>Printing uses your browser's Save as PDF option. No email or billing is connected.</p></section></div><p id="status" role="status"></p><div id="output"></div></main><script src="engine.js"></script><script src="profiles.js"></script><script src="packets.js"></script><script>
const $=id=>document.getElementById(id), store=createProfiles(localStorage), kinds=Object.keys(engines);
const say=t=>$('status').textContent=t;
for(const k of kinds){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=k;c.checked=['Arithmetic','Spelling'].includes(k);l.append(c,' '+k);$('kinds').append(l)}
function refresh(){const box=$('profiles');box.replaceChildren();store.list().forEach((s,i)=>{const row=document.createElement('p');row.append(document.createTextNode(s.name+' — '+s.kinds.join(', ')+' '));const del=document.createElement('button');del.textContent='Remove';del.onclick=()=>{store.remove(i);refresh()};row.append(del);box.append(row)})}
$('add').onclick=()=>{try{const chosen=[...$('kinds').querySelectorAll('input:checked')].map(x=>x.value);store.add({name:$('name').value,kinds:chosen,n:+$('count').value,max:+$('difficulty').value,op:$('op').value,words:$('words').value.split(',').map(x=>x.trim()).filter(Boolean)});$('name').value='';refresh();say('Student saved on this device.')}catch(e){say(e.message)}};
const node=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};
function makePage(entry,key){const p=node('section',undefined,'page'+(key?' answer-page':''));p.append(node('img'));const img=p.firstChild;img.src='logo.svg';img.alt='TwentySeed Learning';img.className='brand';p.append(node('h2',entry.kind+(key?' — Answer key':'')));p.append(node('p','Student: '+entry.student+'     Day: '+entry.day+'     Date: __________'));if(!key)p.append(node('p',entry.result.instructions));const wide=['Crossword','Word search','Handwriting'].includes(entry.kind);const qs=node('div',undefined,'questions'+(wide?' wide':''));entry.result.items.forEach((it,i)=>qs.append(node('div',(i+1)+'. '+(key?it.a:it.q),'question')));p.append(qs);p.append(node('p','TwentySeed Learning • Practice makes progress'));return p}
$('build').onclick=()=>{try{const profiles=store.list();if(!profiles.length)throw Error('Save at least one student first.');const entries=buildPacket(profiles,+$('days').value,(kind,s)=>{if(!engines[kind])throw Error('Unknown category '+kind);return engines[kind]({n:s.n,max:s.max,op:s.op,words:s.words})});const out=$('output');out.replaceChildren();for(const e of entries)out.append(makePage(e,false));if($('keys').checked)for(const e of entries)out.append(makePage(e,true));say('Generated '+entries.length+' worksheets'+($('keys').checked?' and '+entries.length+' answer keys':'')+'. Review before printing.')}catch(e){say(e.message)}};
$('print').onclick=()=>{if(!$('output').children.length){say('Generate a packet before printing.');return}window.print()};refresh();
</script></html>
