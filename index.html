<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TwentySeed Learning</title><style>body{margin:0;font:16px system-ui;color:#18352c;background:#f4f7f2}header,main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between}h1{font-size:42px;line-height:1.1}small{color:#527365}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px}aside,article{background:white;padding:24px;border:1px solid #dce6dc;border-radius:14px}label{display:block;margin:14px 0 5px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #bccdc1;border-radius:7px}button{background:#206b48;color:white;cursor:pointer;margin-top:12px}button.secondary{background:white;color:#206b48}#questions{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 18px;margin:30px 0;white-space:pre-wrap}.q{min-height:44px;break-inside:avoid}.trace{font-size:28px;color:#aaa;letter-spacing:3px;border-bottom:1px dashed #aaa}#key{display:none;white-space:pre-wrap}#sheet h2{text-align:center}footer{margin-top:30px;border-top:1px solid #ddd;padding-top:12px;font-size:12px;text-align:center}@media(max-width:700px){.layout{grid-template-columns:1fr}h1{font-size:32px}}@media print{body{background:white;color:black}header,.intro,aside,.noprint{display:none!important}main{padding:0;max-width:none}.layout{display:block}article{border:0;padding:0}#key.show{display:block;break-before:page}#questions{gap:20px}@page{size:letter;margin:.6in}}</style><header><strong>🌱 TwentySeed Learning</strong><small>Free worksheet studio</small></header><main><section class="intro"><h1>Fresh practice.<br>Ready to print.</h1><p>Create personalized learning worksheets in seconds. No account required.</p></section><div class="layout"><aside><label for="kind">Worksheet</label><select id="kind"></select><label for="student">Student name (optional)</label><input id="student" maxlength="60"><label for="level">Difficulty</label><select id="level"><option value="10">Beginner</option><option value="12" selected>Intermediate</option><option value="50">Advanced</option></select><label for="count">Questions</label><select id="count"><option>6</option><option selected>12</option><option>18</option></select><div id="extra"><label for="words">Words or sentences (one per line)</label><textarea id="words" rows="5">apple
planet
garden
river
school
friend</textarea></div><div id="math"><label for="operation">Operation</label><select id="operation"><option>+</option><option>−</option><option>×</option><option>÷</option></select></div><button id="generate">Generate worksheet</button><button class="secondary" id="print">Print / Save PDF</button><label><input style="width:auto" type="checkbox" id="answers" checked> Include answer key when printing</label><p><small>Prototype · No payment or account services connected.</small></p></aside><article id="sheet"><h2 id="heading"></h2><p id="identity"></p><p id="instructions"></p><div id="questions"></div><footer>TwentySeed Learning • Practice makes progress</footer><section id="key"><h2>Answer key</h2><div id="solutions"></div></section></article></div></main><script src="engine.js"></script><script>const $=id=>document.getElementById(id);const kinds=Object.keys(engines);for(const k of kinds){const o=document.createElement('option');o.textContent=k;$('kind').append(o)}function render(){const k=$('kind').value;$('extra').hidden=!['Spelling','Handwriting','Word search'].includes(k);$('math').hidden=k!=='Arithmetic';const words=$('words').value.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,18);const result=engines[k]({n:+$('count').value,max:+$('level').value,words,op:$('operation').value});$('heading').textContent=k+' Practice';$('identity').textContent='Name: '+($('student').value||'____________________')+'     Date: __________';$('instructions').textContent=result.instructions;$('questions').replaceChildren();$('solutions').replaceChildren();result.items.forEach((p,i)=>{const d=document.createElement('div');d.className='q'+(k==='Handwriting'?' trace':'');d.textContent=(i+1)+'. '+p.q;$('questions').append(d);const a=document.createElement('p');a.textContent=(i+1)+'. '+p.a;$('solutions').append(a)});$('questions').style.gridTemplateColumns=k==='Word search'||k==='Handwriting'?'1fr':'repeat(2,1fr)'}$('generate').onclick=render;$('kind').onchange=render;$('print').onclick=()=>{$('key').classList.toggle('show',$('answers').checked);window.print()};render()</script></html>
