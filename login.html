<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent login | TwentySeed Learning</title><style>body{margin:0;background:#f4f7f2;color:#18352c;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:24px}header img{width:220px;max-width:100%}nav{display:flex;flex-wrap:wrap;gap:10px}nav a{padding:10px 14px;border-radius:8px;background:#e4efe5;color:#174c32;text-decoration:none;font-weight:600}main section{max-width:570px;background:white;border:1px solid #dce6dc;border-radius:14px;padding:24px}label{display:block;margin:12px 0 5px}input,button{font:inherit;padding:11px;box-sizing:border-box}input{width:100%;border:1px solid #b6cbbd;border-radius:7px}button{background:#205d38;color:white;border:0;border-radius:7px;cursor:pointer;margin:9px 8px 0 0}button:disabled{opacity:.55;cursor:not-allowed}#message{white-space:pre-wrap;line-height:1.5}p{line-height:1.55}[hidden]{display:none!important}</style><header><a href="./"><img src="logo.svg" alt="TwentySeed Learning"></a><nav aria-label="Main navigation"><a href="./">Worksheets</a><a href="weekly.html">Weekly packets</a><a href="login.html" aria-current="page">Parent login</a></nav></header><main><section><h1>Parent account</h1><p id="setup">Authentication is not configured yet. No passwords are accepted until the identity provider is connected.</p><form id="account" hidden><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" type="password" minlength="8" required autocomplete="current-password"><div><button type="submit" id="signin">Sign in</button><button type="button" id="signup">Create account</button><button type="button" id="forgot">Reset password by email</button></div></form><form id="recover" hidden><h2>Choose a new password</h2><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Update password</button></form><p id="message" role="status" aria-live="polite"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>
(async function(){'use strict';const $=id=>document.getElementById(id),auth=window.TwentySeedAuth.getClient();if(!auth){$('setup').textContent='Parent sign-in is temporarily unavailable until the secure identity provider is configured. Please do not enter passwords.';return} $('setup').textContent='Sign in or create a parent account. Check your inbox to verify a new email address.';$('account').hidden=false;const say=s=>$('message').textContent=s;const redirect=()=>location.replace(window.TwentySeedAuth.safeNext());const busy=on=>document.querySelectorAll('button').forEach(b=>b.disabled=on);const email=()=>$('email').value.trim();const password=()=>$('password').value;const recoveryUrl=new URL('login.html',location.href).href;
auth.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){$('account').hidden=true;$('recover').hidden=false;say('Set a new password below.')}else if(event==='SIGNED_IN'&&session&&!location.hash.includes('type=recovery')&&$('recover').hidden){redirect()}});
$('account').onsubmit=async e=>{e.preventDefault();busy(true);try{const {error}=await auth.auth.signInWithPassword({email:email(),password:password()});if(error)throw error;redirect()}catch(err){say(err.message)}finally{busy(false)}};
$('signup').onclick=async()=>{if(!email()||password().length<8){say('Enter a valid email and a password of at least 8 characters.');return}busy(true);try{const {error}=await auth.auth.signUp({email:email(),password:password(),options:{emailRedirectTo:recoveryUrl}});if(error)throw error;say('Check your email for a confirmation link.')}catch(err){say(err.message)}finally{busy(false)}};
$('forgot').onclick=async()=>{if(!email()||!$('email').checkValidity()){say('Enter a valid email address first.');return}busy(true);try{const {error}=await auth.auth.resetPasswordForEmail(email(),{redirectTo:recoveryUrl});if(error)throw error;say('If this email has an account, a password reset link will be sent.')}catch(err){say(err.message)}finally{busy(false)}};
$('recover').onsubmit=async e=>{e.preventDefault();busy(true);try{const {error}=await auth.auth.updateUser({password:$('new-password').value});if(error)throw error;await auth.auth.signOut();$('recover').hidden=true;$('account').hidden=false;say('Password updated. Please sign in.')}catch(err){say(err.message)}finally{busy(false)}};
})();
</script></html>
